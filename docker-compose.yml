# =============================================================
# PTSP WhatsApp Bot — Docker Compose (backend Go + frontend Astro)
# Build context = root repo (backend/ + frontend/).
# =============================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptsp-wa-bot-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://app.infisical.com/api}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/bot-kemenag}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
    # Data sesi WA disimpan di Postgres (sqlstore), bukan volume lokal.