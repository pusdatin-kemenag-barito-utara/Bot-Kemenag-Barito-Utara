<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — Bot PTSP Kemenag Barito Utara</title>
    <link rel="icon" href="/logo.kemenag.svg" type="image/svg+xml">
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Login CSS Module -->
    <link rel="stylesheet" href="/css/login.css">

    <!-- Cloudflare Turnstile API Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<div class="bg-glow"></div>

<div class="login-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <img src="/logo.kemenag.svg" alt="Kemenag Logo" class="brand-logo-img" />
        <h1 style="font-size: 20px; font-weight: 800;">Bot PTSP Kemenag</h1>
        <p style="font-size: 12.5px; color: var(--text-secondary); margin-top: 4px;">Kabupaten Barito Utara — Panel Admin</p>
    </div>

    <div id="error-box" style="display:none; padding:10px 14px; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); border-radius:8px; color:#fca5a5; font-size:12.5px; margin-bottom:18px; text-align:center;"></div>

    <form id="login-form">
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon-left"></i>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username admin" required />
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon-left"></i>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password admin" required />
                <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Tampilkan/Sembunyikan Password">
                    <i class="fa-solid fa-eye-slash" id="pwd-eye-icon"></i>
                </button>
            </div>
        </div>

        <!-- Cloudflare Turnstile Widget Container -->
        <div style="margin-bottom: 18px; display: flex; justify-content: center;">
            <div id="turnstile-container"></div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">
            <span>Masuk ke Dashboard</span>
        </button>
    </form>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('pwd-eye-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        }
    }

    async function initTurnstile() {
        try {
            const res = await fetch('/api/auth/turnstile-key');
            const data = await res.json();
            const siteKey = data.siteKey || '0x4AAAAAADR1O_LSp1lgc3km';
            
            const checkInterval = setInterval(() => {
                if (window.turnstile) {
                    clearInterval(checkInterval);
                    turnstile.render('#turnstile-container', {
                        sitekey: siteKey,
                        theme: 'dark'
                    });
                }
            }, 100);
        } catch(e){}
    }

    window.addEventListener('DOMContentLoaded', initTurnstile);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('error-box');
        const btn = document.getElementById('btn-login');
        
        errBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value || '';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, turnstileToken })
            });

            const data = await res.json();
            if (data.success) {
                setTimeout(() => {
                    window.location.href = '/';
                }, 150);
            } else {
                errBox.textContent = data.message || 'Login gagal';
                errBox.style.display = 'block';
                if (window.turnstile) turnstile.reset();
            }
        } catch(err) {
            errBox.textContent = 'Terjadi kesalahan jaringan. Coba lagi.';
            errBox.style.display = 'block';
            if (window.turnstile) turnstile.reset();
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Masuk ke Dashboard</span>';
        }
    });
</script>

</body>
</html>
