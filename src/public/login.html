<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — Bot PTSP Kemenag Barito Utara</title>
    <link rel="icon" href="/logo.kemenag.svg" type="image/svg+xml">
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Login CSS Module -->
    <link rel="stylesheet" href="/css/login.css">

    <!-- Cloudflare Turnstile API Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow-secondary"></div>

<div class="login-card">
    <div class="brand-header">
        <div class="logo-badge">
            <img src="/logo.kemenag.svg" alt="Kemenag Logo" class="brand-logo-img" />
        </div>
        <h1 class="brand-title">Bot PTSP Kemenag</h1>
        <p class="brand-subtitle">Kabupaten Barito Utara</p>
        <div class="brand-badge-tag">
            <i class="fa-solid fa-shield-halved"></i> Panel Admin Management
        </div>
    </div>

    <div id="error-box">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="error-msg"></span>
    </div>

    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon-left"></i>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username admin" required autocomplete="username" />
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon-left"></i>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password admin" required autocomplete="current-password" />
                <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Tampilkan/Sembunyikan Password" tabindex="-1">
                    <i class="fa-solid fa-eye-slash" id="pwd-eye-icon"></i>
                </button>
            </div>
        </div>

        <!-- Cloudflare Turnstile Widget Container -->
        <div style="margin-bottom: 20px; display: flex; justify-content: center; min-height: 65px;">
            <div id="turnstile-container"></div>
        </div>

        <button type="submit" class="btn-submit" id="btn-login">
            <span>Masuk ke Dashboard</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('pwd-eye-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        }
    }

    async function initTurnstile() {
        try {
            const res = await fetch('/api/auth/turnstile-key');
            const data = await res.json();
            const siteKey = data.siteKey || '0x4AAAAAADR1O_LSp1lgc3km';
            
            const checkInterval = setInterval(() => {
                if (window.turnstile) {
                    clearInterval(checkInterval);
                    turnstile.render('#turnstile-container', {
                        sitekey: siteKey,
                        theme: 'dark'
                    });
                }
            }, 100);
        } catch(e){}
    }

    window.addEventListener('DOMContentLoaded', initTurnstile);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('error-box');
        const errMsg = document.getElementById('error-msg');
        const btn = document.getElementById('btn-login');
        
        errBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Memproses...</span>';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value || '';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, turnstileToken })
            });

            const data = await res.json();
            if (data.success) {
                setTimeout(() => {
                    window.location.href = '/';
                }, 150);
            } else {
                errMsg.textContent = data.message || 'Login gagal';
                errBox.style.display = 'flex';
                if (window.turnstile) turnstile.reset();
            }
        } catch(err) {
            errMsg.textContent = 'Terjadi kesalahan jaringan. Coba lagi.';
            errBox.style.display = 'flex';
            if (window.turnstile) turnstile.reset();
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Masuk ke Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
        }
    });
</script>

</body>
</html>
